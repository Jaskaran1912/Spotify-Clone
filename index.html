<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container bg-black flex">
        <div class="left bg-black">
            <div class="home p-1 bg-grey m-1 rounded">
                <div class="logo"><img src="svgs/logo.svg" alt="logo"></div>
                <ul>
                    <li><img class="invert" src="svgs/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="svgs/search.svg" alt="search">Search</li>
                </ul>
                <svg class="close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                    color="#ffffff" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"></path>
                </svg>
            </div>
            <div class="library p-1 bg-grey m-1 rounded">
                <div>
                    <h3>Your Library</h3>
                </div>
                <div class="songList">
                    <ul>

                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/in-en/legal/">Legal</a></div>
                    <div><a href="https://www.spotify.com/in-en/safetyandprivacy/">Safety &amp; Privacy
                            Center</a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/">Privacy Policy</a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/">Cookies</a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3">About Ads</a></div>
                    <div><a href="https://www.spotify.com/in-en/accessibility/">Accessibility</a></div>
                </div>
            </div>
        </div>


        <div class="right bg-grey rounded">
            <div class="header flex">
                <div class="nav">
                    <img class="hamburger" src="svgs/ham.svg" alt="">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff"
                        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff"
                        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"></path>
                    </svg>
                </div>
                <div class="buttons">
                    <button class="Sign">Sign up</button>
                    <button class="Login">Log in</button>
                </div>
            </div>
            <div class="spotifyPlaylists">
                <h1>Spotify Playlists</h1>
                <div class="card-container flex">

                </div>
            </div>
            <div class="playbar">
                <div class="seekbar">
                    <div class="circle">

                    </div>
                </div>
                <div class="bar">
                    <div class="songinfo"></div>
                    <div class="songbuttons flex justify-center">
                        <img id="previous" src="svgs/previous.svg" alt="">
                        <img id="play" src="svgs/play.svg" alt="">
                        <img id="next" src="svgs/next.svg" alt="">
                    </div>
                    <div class="songtime flex">
                        <div class="time"></div>
                        <div class="volume">
                            <img src="svgs/volume.svg" alt="">
                            <div class="slash"><img src="svgs/slash.svg" alt="">
                            </div>
                            <div class="soundlevelborder flex">
                                <div class="soundlevel">
                                    <div class="circlesound">
                                        <img src="svgs/circle.svg" alt="">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
